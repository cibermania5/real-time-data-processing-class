[project]
name = "lesson11-capstone"
version = "0.1.0"
description = "Lesson 11: production-shaped CDC from Postgres to ClickHouse"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8.18",
    "fastapi>=0.115.0",
    "prometheus-client>=0.21.0",
    "psycopg[binary]>=3.2.0",
    "pyspark==4.0.1",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

