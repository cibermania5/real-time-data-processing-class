name: lesson11

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: l11-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: lesson11
      POSTGRES_PASSWORD: lesson11
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres-init.sql:/docker-entrypoint-initdb.d/10-orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lesson11 -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped
    networks: [lesson11]

  kafka:
    image: apache/kafka:3.9.1
    container_name: l11-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: L11LessonKafkaCluster1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    mem_limit: 768m
    restart: unless-stopped
    networks: [lesson11]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.8
    container_name: l11-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    mem_limit: 384m
    restart: unless-stopped
    networks: [lesson11]

  topic-init:
    image: apache/kafka:3.9.1
    container_name: l11-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - cdc.public.orders
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"
    networks: [lesson11]

  connect:
    build:
      context: .
      dockerfile: connect/Dockerfile
    image: lesson11-connect:7.9.8-debezium-3.0.8
    container_name: l11-connect
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: lesson11-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _l11_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _l11_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _l11_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_STORAGE_PARTITIONS: 1
      CONNECT_OFFSET_STORAGE_PARTITIONS: 1
      CONNECT_STATUS_STORAGE_PARTITIONS: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_HEAP_OPTS: -Xms256m -Xmx640m
    ports:
      - "18083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 25s
    mem_limit: 768m
    restart: unless-stopped
    networks: [lesson11]

  connector-init:
    image: curlimages/curl:8.14.1
    container_name: l11-connector-init
    depends_on:
      connect:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ./connect/orders-connector.json:/config/orders-connector.json:ro
      - ./connect/register.sh:/config/register.sh:ro
    entrypoint: ["/bin/sh", "/config/register.sh"]
    restart: "no"
    networks: [lesson11]

  clickhouse:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    container_name: l11-clickhouse
    environment:
      CLICKHOUSE_DB: lesson11
      CLICKHOUSE_USER: lesson11
      CLICKHOUSE_PASSWORD: lesson11
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "18123:8123"
      - "19000:9000"
      - "19363:9363"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/clickhouse-init.sql:/docker-entrypoint-initdb.d/10-analytics.sql:ro
      - ./prometheus/clickhouse-prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./prometheus/clickhouse-resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user lesson11 --password lesson11 --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1024m
    restart: unless-stopped
    networks: [lesson11]

  stream-processor:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: lesson11-spark:4.0.1
    container_name: l11-stream-processor
    depends_on:
      connector-init:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdc.public.orders
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: lesson11
      CLICKHOUSE_USER: lesson11
      CLICKHOUSE_PASSWORD: lesson11
      CHECKPOINT_PATH: /opt/lesson11/checkpoints/orders
      METRICS_PORT: 9108
      SINK_DELAY_SECONDS: ${SINK_DELAY_SECONDS:-0}
      SPARK_DRIVER_MEMORY: 768m
      SPARK_EXECUTOR_MEMORY: 768m
      SPARK_SHUFFLE_PARTITIONS: 2
      PYTHONUNBUFFERED: 1
    command:
      - /opt/spark/bin/spark-submit
      - /opt/lesson11/processor/stream_processor.py
    ports:
      - "14040:4040"
      - "19108:9108"
    volumes:
      - ./processor:/opt/lesson11/processor:ro
      - spark-checkpoints:/opt/lesson11/checkpoints
      - spark-ivy:/opt/spark/ivy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9108/metrics', timeout=2)\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: 1536m
    restart: unless-stopped
    networks: [lesson11]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lesson11-api:local
    container_name: l11-api
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: lesson11
      CLICKHOUSE_USER: lesson11
      CLICKHOUSE_PASSWORD: lesson11
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped
    networks: [lesson11]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: l11-prometheus
    depends_on:
      api:
        condition: service_healthy
      stream-processor:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 384m
    restart: unless-stopped
    networks: [lesson11]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: l11-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lesson11
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lesson11-pipeline.json
    ports:
      - "13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 320m
    restart: unless-stopped
    networks: [lesson11]

networks:
  lesson11:
    name: l11-network

volumes:
  postgres-data:
    name: l11-postgres-data
  kafka-data:
    name: l11-kafka-data
  clickhouse-data:
    name: l11-clickhouse-data
  spark-checkpoints:
    name: l11-spark-checkpoints
  spark-ivy:
    name: l11-spark-ivy
  prometheus-data:
    name: l11-prometheus-data
  grafana-data:
    name: l11-grafana-data
